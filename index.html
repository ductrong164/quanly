<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GetKey — KillAuth</title>
  <style>
    :root {
      --bg: #0b1020;
      --surface: #121a2b;
      --surface-2: #172233;
      --border: rgba(255,255,255,0.08);
      --text: #edf5ff;
      --muted: #a7b1c2;
      --cyan: #47d6ff;
      --green: #32d59a;
      --amber: #f5b84b;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(100%, 440px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 64px var(--shadow), 0 0 25px rgba(71,214,255,0.08);
      padding: 28px 22px;
    }

    .logo {
      text-align: center;
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--cyan), #7b8cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 22px;
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(71,214,255,0.1);
      color: var(--cyan);
      border: 1px solid rgba(71,214,255,0.25);
      margin-bottom: 18px;
    }

    .panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 18px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .desc {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
    }

    .chip.green {
      background: rgba(50,213,154,0.08);
      border-color: rgba(50,213,154,0.2);
      color: var(--green);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    input, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      font: inherit;
    }

    input {
      background: var(--surface-2);
      color: var(--text);
      padding: 14px 14px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: rgba(71,214,255,0.5);
      box-shadow: 0 0 0 3px rgba(71,214,255,0.12);
    }

    button {
      background: linear-gradient(135deg, #2dc2ff, #53d0ff);
      color: #09131d;
      padding: 14px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 30px rgba(71,214,255,0.2);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .alert {
      margin-top: 12px;
      background: rgba(245,184,75,0.08);
      border: 1px solid rgba(245,184,75,0.2);
      color: #ffd588;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .wrap { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">GetKey</div>
    <div class="subtitle">Chọn ứng dụng để nhận mã kích hoạt</div>

    <div class="badge">
      <span>12 Giờ</span>
    </div>

    <div class="panel">
      <div class="title">Key 12 Giờ</div>
      <div class="desc">Vượt 1 link bypass — key sẽ được cấp tự động sau khi hoàn thành.</div>
    </div>

    <div class="chips">
      <span class="chip">Bypass 1</span>
      <span>→</span>
      <span class="chip green">Nhận Key</span>
    </div>

    <form id="getKeyForm" method="POST" action="https://quanly-r5cj.onrender.com/getkey/index.php">
      <label for="app_id">Chọn App ID</label>
      <input id="app_id" name="app_id" type="text" placeholder="Nhập App ID" required />
      <button type="submit">Lấy Key 12 Giờ</button>
    </form>

    <div class="alert">
      Sau khi bấm lấy key, trang sẽ mở link bypass Layma. Sau khi hoàn thành, hệ thống sẽ tự động quay lại để nhận key.
    </div>
  </div>

  <script>
    (function () {
      const hash = window.location.hash || '';
      const target = hash.startsWith('#') ? hash.slice(1) : hash;

      if (target && /^https?:\/\//i.test(target)) {
        try {
          const decoded = decodeURIComponent(target);
          if (/^https?:\/\//i.test(decoded)) {
            window.location.replace(decoded);
            return;
          }
        } catch (e) {
          // bỏ qua
        }
      }

      const form = document.getElementById('getKeyForm');
      if (form) {
        form.addEventListener('submit', function () {
          const btn = form.querySelector('button');
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';
          }
        });
      }
    })();
  </script>
</body>
</html>
