<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang chuyển hướng...</title>
  <style>
    :root {
      --bg: #08111d;
      --bg-2: #0e1a2b;
      --surface: rgba(18, 28, 43, 0.9);
      --surface-2: rgba(24, 37, 56, 0.95);
      --border: rgba(255,255,255,0.08);
      --text: #edf5ff;
      --muted: #aac0d7;
      --cyan: #4fd7ff;
      --green: #3ee0a2;
      --violet: #7b8bff;
      --shadow: rgba(2, 6, 12, 0.7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(79, 215, 255, 0.12), transparent 35%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: min(100%, 440px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 80px var(--shadow), 0 0 40px rgba(79, 215, 255, 0.08);
      padding: 26px 22px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% -20%, rgba(79, 215, 255, 0.16), transparent 40%);
      pointer-events: none;
    }

    .logo {
      position: relative;
      font-size: clamp(2rem, 6vw, 2.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .message {
      position: relative;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .spinner {
      position: relative;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.08);
      border-top-color: var(--cyan);
      border-right-color: var(--violet);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(79, 215, 255, 0.25);
      background: rgba(79, 215, 255, 0.09);
      color: var(--cyan);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GetKey</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="message">Đang chuyển hướng tới liên kết bypass...</div>
    <div class="status">Redirecting</div>
  </div>

  <script>
    (function () {
      const hash = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)) : '';
      const target = hash.trim();

      if (!target) {
        document.querySelector('.message').textContent = 'Không có liên kết chuyển hướng. Vui lòng quay lại trang lấy key.';
        setTimeout(function () {
          window.location.href = 'https://killcheat.onrender.com/getkey';
        }, 1800);
        return;
      }

      setTimeout(function () {
        window.location.replace(target);
      }, 1200);
    })();
  </script>
</body>
</html>
