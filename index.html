<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KillAuth — Xác Minh Bypass</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:    #0a0a0f;
      --surface: #12121a;
      --cyan:    #00d4ff;
      --violet:  #7c3aed;
      --text-1:  #e8eaf0;
      --text-2:  #8b92a8;
    }

    body {
      background: var(--void);
      color: var(--text-1);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid rgba(0,212,255,.2);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 40px rgba(0,212,255,.06);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
    }

    /* Ring spinner */
    .ring-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .ring {
      position: relative;
      width: 72px;
      height: 72px;
    }
    .ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: spin 1.4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ring-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring-icon svg { animation: none; }

    /* Progress bar */
    .bar-track {
      height: 4px;
      background: rgba(0,212,255,.12);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      border-radius: 99px;
      transition: width .05s linear;
    }

    .status {
      font-size: .85rem;
      color: var(--text-2);
      line-height: 1.6;
    }
    .status strong { color: var(--cyan); }

    .note {
      margin-top: 1.5rem;
      font-size: .72rem;
      color: rgba(139,146,168,.5);
    }

    /* Done state */
    .done-icon {
      display: none;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(16,217,138,.1);
      border: 2px solid rgba(16,217,138,.4);
      margin: 0 auto 1.75rem;
    }
    .done-icon svg { color: #10d98a; }
    .done-text { color: #10d98a; font-weight: 700; font-size: .95rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">KillAuth</div>

  <!-- Spinner (ẩn khi done) -->
  <div class="ring-wrap" id="spinnerWrap">
    <div class="ring">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="30" stroke="rgba(0,212,255,.12)" stroke-width="5"/>
        <path d="M36 6 A30 30 0 0 1 66 36" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g" x1="36" y1="6" x2="66" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#00d4ff"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="ring-icon">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="#00d4ff" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944
                   a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591
                   3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622
                   0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Done icon (hiện khi redirect) -->
  <div class="done-icon" id="doneIcon">
    <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
  </div>

  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>

  <div class="status" id="statusText">
    Đang xác minh yêu cầu...<br>
    <strong>Vui lòng chờ trong giây lát</strong>
  </div>

  <div class="note" id="noteText">
    Trang này xác nhận bạn đã mở link bypass.<br>
    Bạn sẽ được tự động chuyển về KillAuth.
  </div>
</div>

<script>
  var DELAY_MS = 3000; // 3 giây — đổi nếu muốn dài hơn

  var bar        = document.getElementById('bar');
  var statusEl   = document.getElementById('statusText');
  var noteEl     = document.getElementById('noteText');
  var spinnerEl  = document.getElementById('spinnerWrap');
  var doneEl     = document.getElementById('doneIcon');

  // Lấy dest URL từ hash fragment
  var dest = '';
  try {
    var raw = location.hash.slice(1); // bỏ dấu #
    if (raw) dest = decodeURIComponent(raw);
  } catch(e) {}

  if (!dest) {
    // Không có dest → có thể ai đó mở thẳng trang
    statusEl.innerHTML = 'Không tìm thấy link hợp lệ.<br><strong style="color:#f87171">Vui lòng lấy key lại từ đầu.</strong>';
    noteEl.textContent = '';
  } else {
    var start = Date.now();

    function tick() {
      var elapsed = Date.now() - start;
      var pct = Math.min((elapsed / DELAY_MS) * 100, 100);
      bar.style.width = pct + '%';

      if (elapsed < DELAY_MS * 0.4) {
        statusEl.innerHTML = 'Đang xác minh yêu cầu...<br><strong>Vui lòng chờ trong giây lát</strong>';
      } else if (elapsed < DELAY_MS * 0.8) {
        statusEl.innerHTML = 'Xác minh thành công.<br><strong>Đang chuẩn bị chuyển hướng...</strong>';
      }

      if (elapsed >= DELAY_MS) {
        // Done
        bar.style.width = '100%';
        spinnerEl.style.display = 'none';
        doneEl.style.display    = 'flex';
        statusEl.innerHTML = '<span class="done-text">Xác minh hoàn tất!</span><br><span style="color:var(--text-2);font-size:.8rem">Đang chuyển về KillAuth...</span>';
        noteEl.textContent = '';
        setTimeout(function() { location.href = dest; }, 300);
      } else {
        requestAnimationFrame(tick);
      }
    }

    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
