<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=about:blank" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #e5eefb;
      font-family: Arial, Helvetica, sans-serif;
    }
    .box {
      padding: 24px 28px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #a7b1c2; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">Đang chuyển hướng...</div>
    <div class="sub">Vui lòng chờ trong giây lát.</div>
  </div>

  <script>
    (function () {
      const backendUrl = 'https://quanly-r5cj.onrender.com/getkey/index.php';
      const hash = window.location.hash || '';
      const target = hash.startsWith('#') ? hash.slice(1) : hash;

      if (!target) {
        window.location.replace(backendUrl);
        return;
      }

      try {
        const decoded = decodeURIComponent(target);
        if (decoded && /^https?:\/\//i.test(decoded)) {
          window.location.replace(decoded);
          return;
        }
      } catch (e) {
        // fallback nếu decode lỗi
      }

      // fallback nếu hash không phải URL hợp lệ
      window.location.replace(backendUrl);
    })();
  </script>
</body>
</html>
